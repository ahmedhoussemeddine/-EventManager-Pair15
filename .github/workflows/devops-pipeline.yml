name: Event Manager DevOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-backend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-backend:${{ github.sha }}

  build-and-push-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-frontend:${{ github.sha }}

  deploy:
    needs:
      - build-and-push-backend
      - build-and-push-frontend
    if: github.ref == 'refs/heads/main' && needs.build-and-push-backend.result == 'success' && needs.build-and-push-frontend.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f k8s/

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Select images built by this workflow
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/backend-deployment backend="$DOCKERHUB_USERNAME/eventmanager-backend:$IMAGE_TAG"
          kubectl set image deployment/frontend-deployment frontend="$DOCKERHUB_USERNAME/eventmanager-frontend:$IMAGE_TAG"

      - name: Restart deployments
        run: kubectl rollout restart deployment/backend-deployment deployment/frontend-deployment

      - name: Verify deployment rollouts
        run: |
          kubectl rollout status deployment/backend-deployment --timeout=180s
          kubectl rollout status deployment/frontend-deployment --timeout=180s
