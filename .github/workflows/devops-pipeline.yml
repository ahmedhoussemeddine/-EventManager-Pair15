
name: Event Manager DevOps Pipeline

on:
  push:
    branches:
      - main
      - feature/k8s-frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # 1. TEST
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit & Integration Tests
        run: pytest

  # =========================
  # 2. BUILD AND PUSH BACKEND
  # =========================
  build-and-push-backend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-backend:${{ github.sha }}

  # =========================
  # 3. BUILD AND PUSH FRONTEND
  # =========================
  build-and-push-frontend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-frontend:${{ github.sha }}

  # =========================
  # 4. DEPLOY TO KUBERNETES
  # =========================
  deploy:
    needs:
      - test
      - build-and-push-backend
      - build-and-push-frontend

    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kubernetes
        run: |
          kubectl version
          kubectl cluster-info
          kubectl get nodes

      - name: Kubernetes Dry Run
        run: kubectl apply --dry-run=client -f k8s/

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Update Backend and Frontend Images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $backendImage = "$($env:DOCKERHUB_USERNAME)/eventmanager-backend:$($env:IMAGE_TAG)"
          $frontendImage = "$($env:DOCKERHUB_USERNAME)/eventmanager-frontend:$($env:IMAGE_TAG)"

          kubectl set image deployment/backend-deployment backend=$backendImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl set image deployment/frontend-deployment frontend=$frontendImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Backend Deployment
        run: kubectl rollout status deployment/backend-deployment --timeout=180s

      - name: Verify Frontend Deployment
        run: kubectl rollout status deployment/frontend-deployment --timeout=180s

      - name: Verify Final Kubernetes Status
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
