name: Event Manager DevOps Pipeline

on:
  push:
    branches:
      - main
      - feature/k8s-frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-backend:${{ github.sha }}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eventmanager-frontend:${{ github.sha }}

  deploy:
    needs:
      - build-and-push-backend
      - build-and-push-frontend
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kubernetes
        run: kubectl cluster-info

      - name: Kubernetes Dry Run
        run: kubectl apply --dry-run=client -f k8s/

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Update Backend and Frontend Images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $backendImage = "$($env:DOCKERHUB_USERNAME)/eventmanager-backend:$($env:IMAGE_TAG)"
          $frontendImage = "$($env:DOCKERHUB_USERNAME)/eventmanager-frontend:$($env:IMAGE_TAG)"

          kubectl set image deployment/backend-deployment backend=$backendImage
          kubectl set image deployment/frontend-deployment frontend=$frontendImage

      - name: Restart Deployments
        run: kubectl rollout restart deployment/backend-deployment deployment/frontend-deployment

      - name: Verify Backend
        run: kubectl rollout status deployment/backend-deployment --timeout=180s

      - name: Verify Frontend
        run: kubectl rollout status deployment/frontend-deployment --timeout=180s